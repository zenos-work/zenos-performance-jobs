name: Deploy zenos-jobs

on:
  push:
    branches: [development, main]
    paths:
      - "src/**/*.py"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
      - "README.md"
      - ".dev.vars.example"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Python worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY_HEX: ${{ secrets.VAPID_PRIVATE_KEY_HEX }}
          VAPID_SUBSCRIBER: ${{ vars.VAPID_SUBSCRIBER }}
